<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notre run Stardew Valley 100% chaotique</title>
  <style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#592544 0%,transparent 42%),linear-gradient(140deg,#170e1b,#291322 75%,#1a101a);font:16px system-ui,Segoe UI,sans-serif;color:#fff0f6}.wrap{max-width:850px;margin:auto;padding:48px 22px}h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.lead{color:#d8b8ce;margin:0 0 30px}.panel{background:#ffffff0b;border:1px solid #ffffff24;border-radius:22px;padding:25px;margin:18px 0;box-shadow:0 14px 40px #0003}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.big{font-size:38px;font-weight:800}.muted{color:#c9aabc}.name{font-weight:700;font-size:19px}.stat{font-variant-numeric:tabular-nums;color:#f0c6dc}.track{height:13px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:13px 0 0}.fill{height:100%;background:linear-gradient(90deg,#b44778,#d889bb);width:0%;border-radius:99px;transition:width .5s}.game{padding:19px 0;border-bottom:1px solid #ffffff1c}.game:last-child{border:0;padding-bottom:0}.status{font-size:13px;color:#e4bdd3;line-height:1.6}.badge{display:inline-block;background:#ffffff16;border:1px solid #ffffff2a;border-radius:99px;padding:6px 12px;font-size:13px}button{border:1px solid #db92b9;background:#78365d;color:white;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}button:hover{background:#934b72}.footer{font-size:13px;color:#bda0b3;margin-top:20px}a{color:#efb5d6}@media(max-width:530px){.wrap{padding:24px 14px}.panel{padding:18px}.head{align-items:flex-start}.big{font-size:30px}}

    progress { display: block; width: 100%; appearance: none; }
    progress::-webkit-progress-bar { background: transparent; }
    progress::-webkit-progress-value { background: linear-gradient(90deg,#b44778,#d889bb); border-radius: 99px; }
    progress::-moz-progress-bar { background: linear-gradient(90deg,#b44778,#d889bb); border-radius: 99px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Notre run Stardew Valley 100% chaotique</h1>
    <p class="lead">Archipelago solo · Objectif 100 % des checks</p>
    <section class="panel" aria-labelledby="progress-label">
      <div class="head">
        <div>
          <div id="progress-label" class="muted">Checks validés</div>
          <div id="count" class="big">0 / 2 081</div>
        </div>
        <div id="percent" class="big">0,00 %</div>
      </div>
      <progress id="progress" class="track" aria-labelledby="progress-label" value="0" max="2081"></progress>
    </section>
    <section class="panel">
      <div class="head">
        <div id="status" class="status" role="status">Connexion à Archipelago…</div>
        <button id="refresh" type="button">↻ Actualiser</button>
      </div>
    </section>
    <p class="footer">Le compteur mesure les checks Archipelago de la run. Le suivi affiche uniquement la progression.</p>
  </main>
  <script>
    const trackerId = '0vxgRuQaSSaLoPIZSqZj3Q';
    const formatCount = new Intl.NumberFormat('fr-BE');
    const formatPercent = new Intl.NumberFormat('fr-BE', {
      style: 'percent',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
    const count = document.getElementById('count');
    const percent = document.getElementById('percent');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const refresh = document.getElementById('refresh');

    async function fetchTracker(route) {
      const response = await fetch('https://archipelago.gg/api/' + route + '/' + trackerId, {
        cache: 'no-store',
        signal: AbortSignal.timeout(15000),
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    }

    async function update() {
      if (refresh.disabled) return;
      refresh.disabled = true;
      const isSoloSlot = entry => entry.team === 0 && entry.player === 1;
      try {
        const [live, settings] = await Promise.all([
          fetchTracker('tracker'),
          fetchTracker('static_tracker'),
        ]);
        const checks = live.player_checks_done?.find(isSoloSlot)?.locations;
        const total = settings.player_locations_total?.find(isSoloSlot)?.total_locations;
        if (!Array.isArray(checks) || !Number.isInteger(total) || total <= 0 || checks.length > total) {
          throw new Error('Compteurs invalides');
        }
        count.textContent = formatCount.format(checks.length) + ' / ' + formatCount.format(total);
        percent.textContent = formatPercent.format(checks.length / total);
        progress.max = total;
        progress.value = checks.length;
        const time = new Date().toLocaleTimeString('fr-BE', { timeZone: 'Europe/Brussels' });
        status.textContent = 'Mis à jour à ' + time + ' · Actualisation toutes les 60 secondes';
      } catch {
        status.textContent = 'Actualisation indisponible. Le dernier compteur affiché est conservé.';
      } finally {
        refresh.disabled = false;
      }
    }

    let nextUpdate;
    async function refreshProgress() {
      clearTimeout(nextUpdate);
      await update();
      nextUpdate = setTimeout(refreshProgress, 60000);
    }
    refresh.addEventListener('click', refreshProgress);
    refreshProgress();
  </script>
</body>
</html>
